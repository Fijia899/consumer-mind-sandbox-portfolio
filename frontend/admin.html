<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>旅游决策维度</title><link rel="stylesheet" href="/static/css/travel.css"></head>
<body><header class="topbar"><a class="brand" href="/">旅程心智 <span>JTBD Sandbox</span></a><nav><a href="/">工作台</a><a class="active" href="/admin">决策维度</a></nav><span class="api-status">研究假设</span></header><main class="shell"><section class="hero compact"><div class="eyebrow">DECISION FACTORS</div><h1>旅游决策维度</h1><p>维护触发因素与决策顾虑。启用状态和权重会进入画像生成及话术仿真；新增内容会保存到本地研究数据。</p></section><section class="panel"><div class="section-head"><h2>维度清单</h2><span id="factor-count" class="count">加载中</span></div><div id="factor-list"></div></section><section class="panel"><div class="section-head"><h2>新增维度</h2></div><div class="factor-form"><input id="f-id" placeholder="编码，例如 C1"><select id="f-group"><option value="A">A · 出行触发</option><option value="B">B · 决策顾虑</option></select><input id="f-name" placeholder="维度名称"><input id="f-weight" type="number" min="1" max="10" value="5" aria-label="权重 1 到 10"><input id="f-definition" class="wide" placeholder="定义说明"><input id="f-keywords" class="wide" placeholder="识别关键词，逗号分隔"><button id="add-factor" class="button primary">添加维度</button></div></section></main><script src="/static/js/travel.js"></script></body></html>
